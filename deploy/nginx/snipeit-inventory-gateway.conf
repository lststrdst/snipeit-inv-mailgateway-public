server {
    listen 2443 ssl;
    listen [::]:2443 ssl;
    server_name inventory-gateway.example.com;

    ssl_certificate /etc/letsencrypt/live/inventory-gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory-gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:SnipeITGateway:10m;
    server_tokens off;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 20;
    limit_conn snipeit_gateway_conn 5;
    limit_req zone=snipeit_gateway_rate burst=10 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /api/v1/events {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location / { return 404; }
}
