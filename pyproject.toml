[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snipeit-inventory-gateway"
version = "1.0.0"
description = "Narrow encrypted inventory event gateway for Snipe-IT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Владелец репозитория"}]
dependencies = [
  "cryptography>=50.0.1,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "cyclonedx-bom>=7.3,<8",
  "detect-secrets>=1.5,<2",
  "httpx2>=2,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
snipeit-inventory-gateway = "snipeit_inventory_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snipeit_inventory_gateway"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105"]
